name: Remove non-Mac release assets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the macOS DMG in the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$REPOSITORY/releases/latest" --jq .id)"
          gh api "repos/$REPOSITORY/releases/$release_id/assets" \
            --jq '.[] | select(.name != "GhostTeleprompter-macOS.dmg") | .id' |
          while read -r asset_id; do
            if [[ -n "$asset_id" ]]; then
              gh api --method DELETE "repos/$REPOSITORY/releases/assets/$asset_id"
            fi
          done
