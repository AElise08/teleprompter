name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal native app
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          mkdir -p Teleprompter.app/Contents/MacOS
          swiftc -O -target arm64-apple-macos13.0 -sdk "$sdk" teleprompter.swift -o Teleprompter-arm64
          swiftc -O -target x86_64-apple-macos13.0 -sdk "$sdk" teleprompter.swift -o Teleprompter-x86_64
          lipo -create Teleprompter-arm64 Teleprompter-x86_64 -output Teleprompter.app/Contents/MacOS/Teleprompter
          cp Info.plist Teleprompter.app/Contents/Info.plist
          codesign --force --deep --sign - Teleprompter.app
          lipo -archs Teleprompter.app/Contents/MacOS/Teleprompter
      - name: Create disk image
        run: |
          set -euo pipefail
          mkdir dmg-root
          cp -R Teleprompter.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Ghost Teleprompter" -srcfolder dmg-root -ov -format UDZO GhostTeleprompter-macOS.dmg
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" GhostTeleprompter-macOS.dmg --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" GhostTeleprompter-macOS.dmg \
              --repo "$GITHUB_REPOSITORY" \
              --title "Ghost Teleprompter $tag" \
              --generate-notes \
              --latest
          fi
