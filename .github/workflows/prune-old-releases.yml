name: Remove superseded releases

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune-old-releases.yml"

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only v1.2.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in v1.1.0 v1.1.1 v1.2.0; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
            fi
          done
